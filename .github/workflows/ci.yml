name: CI
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # `npm ci` again, on a lockfile generated on Linux.
      #
      # It used to be impossible here: package-lock.json was written on Windows,
      # where npm prunes the optional platform packages that do not match the
      # writing machine (npm/cli#4828). It carried @rollup/rollup-win32-* and
      # @esbuild/win32-x64 and no Linux equivalents, so `npm ci` produced a tree
      # with no rollup binary and vitest died before its first assertion — for
      # five days, unread.
      #
      # The lockfile is now generated on Linux and carries the full matrix for
      # both toolchains, win32 included, so it installs on either platform.
      # Verified by probe before adopting: a Linux-written lockfile keeps the
      # Windows binaries, which is what makes this safe rather than a swap of
      # one broken platform for the other.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  # End-to-end runs as its own job: it needs browsers, and it is the only gate
  # that catches the failures the others structurally cannot — a CSP that
  # blocks every script, an ARIA structure axe does not inspect, a page that
  # builds green and never hydrates. All three have shipped in this repo.
  #
  # This job keeps `npm ci`, because it has been passing on it throughout the
  # outage above: Next builds with swc, whose Linux binaries are in the
  # lockfile, and it never loads rollup. A green badge here beside a red one
  # there is exactly how the breakage stayed invisible, so the difference is
  # left in place and named rather than smoothed over.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # The database these tests read is created here and dies with the job.
      #
      # Deliberately not a hosted project. The suites mutate rows and
      # `fullyParallel` is on, so two pull requests sharing one database would
      # race — the same failure this repository already fixed at test level by
      # giving one spec its own project. A per-run stack removes the shared
      # resource rather than scheduling around it.
      #
      # No secret is involved: the local stack's keys are fixed and public by
      # design. A step here that needs a secret is a step that is wrong.
      #
      # This is also the first time `supabase/migrations` is replayed from an
      # empty database. Both hosted databases were built one migration at a
      # time through the MCP tool and have never been rebuilt, so a failure
      # here is a real finding about the sequence — not a flake to retry.
      - name: Start the database, applying every migration and the seed
        run: npm run db:local

      # Mapped explicitly, and loudly when the names are wrong.
      #
      # `supabase status -o env` emits the stack's own names; the application
      # reads SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY. The `:?` guards turn a
      # renamed key into a failed step with a readable message instead of two
      # empty variables — which would leave the 48 database-backed tests
      # skipping themselves while this job stayed green, which is precisely how
      # the gap survived this long.
      #
      # Only the key names are printed, never the values.
      - name: Export the stack's address to the job
        run: |
          set -euo pipefail
          npx supabase status -o env > /tmp/supabase.env
          echo "keys emitted by supabase status:"
          cut -d= -f1 /tmp/supabase.env | sed 's/^/  /'
          set -a; . /tmp/supabase.env; set +a
          : "${API_URL:?supabase status emitted no API_URL — see the key list above}"
          : "${ANON_KEY:?supabase status emitted no ANON_KEY — see the key list above}"
          : "${SERVICE_ROLE_KEY:?supabase status emitted no SERVICE_ROLE_KEY — see the key list above}"
          echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          # The service-role key, which the Closer lead sheet needs.
          #
          # Activation milestones are derived from the *prospect's* workspace —
          # another tenant — so `closer_activation_metrics` is `service_role`
          # only and `apps/web` establishes authority before calling it. Without
          # this the panel correctly reports that it cannot be read, and the
          # test asserting the milestones would be asserting the failure path.
          #
          # Still no secret: these keys are fixed and public by design for a
          # local stack, which is the same reason ANON_KEY is exported here.
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "DB_URL=$DB_URL" >> "$GITHUB_ENV"

      # The guard that makes this job worth adding.
      #
      # data-surface, workspace and auth skip themselves when SUPABASE_URL is
      # unset — 48 tests, and the job passes anyway. Before this change that was
      # the steady state and nobody read it. Failing here means a broken
      # database step can never again be reported as a green suite.
      # Before the proofs, not after. run.sh spent its whole life comparing 39
      # of the 60 assertions in that directory and reporting success, because
      # it read only `t`/`f` values. A harness that under-counts has no symptom
      # of its own — it just says ok — so it gets a guard of its own. Crafted
      # verdicts through a psql stand-in, no database, which is also why it can
      # run before one exists to blame.
      - name: Check the proof harness itself
        run: bash supabase/tests/harness-selftest.sh

      # The proofs in supabase/tests, which nothing ran until the E2E work.
      #
      # docs/product/11-mvp-scorecard.md cites tenant-isolation.sql as what
      # asserts RLS isolation. It asserted nothing while nothing executed it,
      # and its own header said so: "not yet wired into npm run gates — that
      # needs a database connection in CI". There is one now.
      #
      # Not `supabase test db`: these are not pgTAP. Each is a `do $$ … $$`
      # block that ends with a deliberate raise so the transaction rolls back,
      # which means every one of them exits non-zero on success. The runner
      # reads the verdict string and compares each check against what it wanted
      # — see the header of run.sh for why the exit code and the marker are both
      # insufficient on their own.
      - name: Run the database proofs
        run: bash supabase/tests/run.sh "$DB_URL"

      - name: Refuse to run the suite without a database
        run: |
          test -n "${SUPABASE_URL:-}" || {
            echo "SUPABASE_URL is empty. The 48 database-backed tests would"
            echo "skip themselves and this job would pass having proved nothing."
            exit 1
          }
          echo "SUPABASE_URL is set; the database-backed specs will run."

          # The same guard, for the same reason, one variable later.
          #
          # closer.spec.ts skips its activation test without this key, because
          # the panel can then only report that it cannot read. That skip is
          # correct for a developer and useless in CI: it is exactly the shape
          # of the gap above, where 48 tests excused themselves and the job
          # stayed green. A skip nobody is forced to look at is how a proof
          # becomes decoration.
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}" || {
            echo "SUPABASE_SERVICE_ROLE_KEY is empty. The Closer activation"
            echo "test would skip itself and this job would pass without ever"
            echo "having read an activation milestone."
            exit 1
          }
          echo "SUPABASE_SERVICE_ROLE_KEY is set; the activation test will run."

      - run: npx playwright install --with-deps chromium

      # Fabricated, and safe to fabricate.
      #
      # `isGitHubConfigured()` decides which sentence a workspace without an
      # installation is shown: "has not installed the Localize GitHub App" when
      # the deployment has App credentials, and "no GitHub App configured" when
      # it has none. Every real deployment has them, so CI without them tests a
      # configuration that only a broken deployment has — and workspace.spec.ts
      # rightly asserts the first sentence.
      #
      # These never reach GitHub. `readGitHubApp` only checks that the id is a
      # non-zero number and the key is non-empty; Octokit is constructed further
      # down, after `installationIdFor` returns an installation, and no seeded
      # organization has one. If a future seed adds an installation row, this is
      # where the confusing failure will come from.
      - name: Present a configured GitHub App, without a usable one
        run: |
          {
            echo "GITHUB_APP_ID=1"
            echo "GITHUB_APP_PRIVATE_KEY=deliberately-not-a-key"
            echo "GITHUB_APP_SLUG=localize-infra"
          } >> "$GITHUB_ENV"

      - run: npm run test:e2e
