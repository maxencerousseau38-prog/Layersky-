<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Layersky">
  <title>Layersky</title>
  <!--
    The header wordmark's three rules, at tab size.

    Source: apps/site/src/components/site-header.tsx — a 16px square holding
    three 2px bars at 100%, 75% and 50% width, descending. This is that mark on
    a 32-unit grid, not a new one.

    GEOMETRY. Every value is even so the shape lands on whole pixels when a
    browser rasterises it at 16px: bars at y=6/14/22 become y=3/7/11, heights of
    4 become 2, and widths 24/18/12 become 12/9/6. Half-pixel edges are what
    makes a small icon look smeared, and three horizontal bars is exactly the
    shape that shows it.

    COLOUR. The header paints the bars with the primary, strong and line tokens
    — #0c0e12, #868d9b, #d7dae0 in the light theme. The third is a hairline
    border token: legible beside a wordmark at reading distance, and effectively
    gone at 16px against white. The descent is therefore carried by opacity of
    one ink instead, which preserves what the mark means (three rules, falling
    away) while keeping all three visible.

    The ink follows the tab strip, not the page: prefers-color-scheme is
    honoured for SVG favicons by current Chrome, Firefox and Safari, so dark
    browser chrome gets the dark-theme ink (#f2f4f6) rather than near-black on
    near-black. Both values are the resolved graphite-12 of their theme.

    NOTE. No double hyphen may appear anywhere in this comment: XML forbids it,
    and an invalid SVG still returns 200 with the right MIME type and still gets
    its link tag, so it fails by rendering an empty tab icon rather than by
    erroring. The first version of this file did exactly that.
  -->
  <style>
    .bar { fill: #0c0e12; }
    @media (prefers-color-scheme: dark) {
      .bar { fill: #f2f4f6; }
    }
  </style>
  <rect class="bar" x="4" y="6" width="24" height="4" rx="2" />
  <rect class="bar" x="4" y="14" width="18" height="4" rx="2" opacity="0.62" />
  <rect class="bar" x="4" y="22" width="12" height="4" rx="2" opacity="0.34" />
</svg>
